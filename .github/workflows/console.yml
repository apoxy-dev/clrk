name: console
on:
  push:
    branches: [main]
    paths:
      - 'console/**'
      - 'api/**'
      - 'cmd/openapi-dump/**'
  pull_request:
    paths:
      - 'console/**'
      - 'api/**'
      - 'cmd/openapi-dump/**'

# The console consumes @apoxy/console-core as a SHA-pinned git dependency and
# commits its generated artifacts (console/openapi.json, schema.d.ts,
# resource-schemas.ts). This job builds the console and fails if any committed
# artifact is stale — the same drift gate apoxy-cli runs, as plain Actions
# (clrk has no Dagger).
jobs:
  console-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Private go deps (github.com/apoxy-dev/*) need an auth token; uncomment if
      # this repo's modules aren't public to the runner.
      # env:
      #   GOPRIVATE: github.com/apoxy-dev/*

      # Spec drift: re-render the OpenAPI from the Go types and compare to the
      # committed console/openapi.json.
      - name: Render OpenAPI spec
        run: go run ./cmd/openapi-dump -o /tmp/fresh-openapi.json -title "CLRK Console API" -version v0
      - name: Check console/openapi.json is current
        run: |
          if ! cmp -s /tmp/fresh-openapi.json console/openapi.json; then
            echo "::error::console/openapi.json is stale. Regenerate: go run ./cmd/openapi-dump -o console/openapi.json -title \"CLRK Console API\" -version v0"
            diff /tmp/fresh-openapi.json console/openapi.json | head -40 || true
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install
        working-directory: console
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: console
        run: pnpm -r typecheck
      - name: Test
        working-directory: console
        run: pnpm -r test
      - name: Build
        working-directory: console
        run: pnpm -C apps/clrk-console build

      # TS codegen drift: regenerate schema.d.ts + resource-schemas.ts from the
      # committed spec and fail if they differ from what's checked in.
      - name: Check generated TS schemas are current
        working-directory: console
        run: |
          pnpm codegen
          if ! git diff --quiet -- apps/clrk-console/src/schema; then
            echo "::error::Generated console schemas are stale. Regenerate: pnpm -C console codegen"
            git diff -- apps/clrk-console/src/schema | head -60
            exit 1
          fi
          echo "console: no codegen drift"
