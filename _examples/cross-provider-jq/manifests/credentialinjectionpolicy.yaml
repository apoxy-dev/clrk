# TWO credentials, one per backend, scoped by sectionName. On an
# AIProviderRoute targetRef, `sectionName` names a Backend and gates
# injection until AFTER that backend wins selection. So each provider
# gets only its own key, injected per attempt -- and keys never reach
# the agent.
#
# clrk injects the secret value VERBATIM into the named header: it adds
# no "Bearer " prefix and applies no per-provider default. That is why
# the OpenAI secret must store "Bearer sk-..." (see README), while
# Anthropic's x-api-key takes the raw key.
---
# Anthropic backend: x-api-key with the raw key.
apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: cross-provider-jq-anthropic
spec:
  targetRefs:
    - group: clrk.apoxy.dev
      kind: AIProviderRoute
      name: cross-provider-jq
      sectionName: anthropic-haiku
  secretRef:
    name: anthropic-credentials
  secretKey: api-key
  target: Header
  # Anthropic authenticates with x-api-key, not Authorization: Bearer.
  headerName: x-api-key
---
# OpenAI backend: Authorization header. The translated OpenAI request
# already had the agent's Anthropic auth headers stripped
# (cross-schema translation sheds the source schema's credentials), and
# this CIP injects OpenAI's. The secret VALUE must include the "Bearer "
# prefix -- clrk injects it verbatim.
apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: cross-provider-jq-openai
spec:
  targetRefs:
    - group: clrk.apoxy.dev
      kind: AIProviderRoute
      name: cross-provider-jq
      sectionName: openai-gpt
  secretRef:
    name: openai-credentials
  secretKey: authorization
  target: Header
  headerName: Authorization
