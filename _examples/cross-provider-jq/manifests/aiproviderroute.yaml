apiVersion: clrk.apoxy.dev/v1alpha1
kind: AIProviderRoute
metadata:
  name: cross-provider-jq
spec:
  parentRefs:
    - group: clrk.apoxy.dev
      kind: EgressGateway
      name: cross-provider-jq
  # One rule, two candidates of DIFFERENT wire schemas. The rule matches
  # on provider + endpoint only (no `models` field), so it is model-blind
  # -- which matters: whether a request defers selection to body time is
  # decided at request-HEADERS time by a model-blind match. A
  # model-scoped rule would be invisible at header time and re-selection
  # would never arm. This rule arms it.
  #
  # WITHOUT a FallbackRoutingPolicy attached (the default here), the two
  # backendRefs are a standard Gateway API WEIGHTED split: ~50/50 per
  # request, rolled fresh by Envoy's load balancer. Half the calls are
  # served by Anthropic Haiku, half by OpenAI under translation -- the
  # agent cannot tell the difference.
  #
  # Apply fallbackroutingpolicy.yaml to flip this SAME list into an
  # ordered failover chain (weights ignored; list order is priority).
  rules:
    # Rule 1: inference. /v1/messages is the only path that is
    # load-balanced and cross-schema translated, matched explicitly and
    # split 50/50 across the two providers.
    - matches:
        - provider: anthropic
          endpoints:
            - /v1/messages
      backendRefs:
        - group: clrk.apoxy.dev
          kind: Backend
          name: anthropic-haiku
          weight: 50
        - group: clrk.apoxy.dev
          kind: Backend
          name: openai-gpt
          weight: 50
    # Rule 2: Anthropic control-plane. Claude Code fetches session config
    # from Anthropic (NOT inference) and those calls must carry the real
    # x-api-key or they 401. They route to the anthropic backend ALONE --
    # no split, no translation -- so the sectionName: anthropic-haiku
    # CredentialInjectionPolicy authenticates them. These are bodyless
    # GETs; credential injection on a reselectable rule is resolved at
    # RequestHeaders end-of-stream (pinAtHeadersEOS) since no body arrives.
    #
    # Endpoints are matched EXACTLY (no glob): path.Match's `*` does not
    # cross '/', and an empty list would match every Anthropic path. List
    # new control-plane endpoints here if a Claude Code version adds them.
    # The GETs are bodyless and authenticate at request-headers EOS; the
    # /metrics POST carries a body and authenticates on the normal body
    # path -- both need the real x-api-key or they 401.
    - matches:
        - provider: anthropic
          endpoints:
            - /api/claude_code/settings
            - /api/claude_code/policy_limits
            - /api/claude_code/organizations/metrics_enabled
            - /api/claude_code/metrics
      backendRefs:
        - group: clrk.apoxy.dev
          kind: Backend
          name: anthropic-haiku
