apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: model-router
spec:
  # Route-wide attachment (no sectionName): this credential is injected
  # whichever backend wins selection. On re-selectable requests the
  # injection happens per upstream attempt, after Envoy picks the
  # backend — keys still never reach the agent.
  #
  # To scope a credential to ONE backend — e.g. a different account key
  # for the budget backend — add `sectionName: anthropic-budget` to the
  # targetRef below; that policy then fires only when that backend is
  # selected, stacked on top of route-wide entries.
  targetRefs:
    - group: clrk.apoxy.dev
      kind: AIProviderRoute
      name: model-router
  # Operator-applied Secret. The README documents the `clrk dev
  # --secret` step — never commit a placeholder value here.
  secretRef:
    name: anthropic-credentials
  secretKey: api-key
  target: Header
  # Anthropic's API uses x-api-key, not Authorization: Bearer.
  headerName: x-api-key
