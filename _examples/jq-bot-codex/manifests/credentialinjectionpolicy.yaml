apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: openai
spec:
  targetRefs:
    - group: clrk.apoxy.dev
      kind: AIProviderRoute
      name: openai
  secretRef:
    name: openai-credentials
  # clrk injects the secret value VERBATIM and adds no prefix of its own,
  # so the secret must store the full header value including "Bearer ".
  # Create it with:
  #   kubectl create secret generic openai-credentials \
  #     --from-literal=authorization="Bearer $OPENAI_API_KEY"
  secretKey: authorization
  target: Header
  headerName: Authorization
