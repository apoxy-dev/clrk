apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: fallback-router
spec:
  # Route-wide attachment (no sectionName): the key is injected on
  # whichever backend serves the attempt. Injection happens per
  # ATTEMPT — when a request walks from anthropic-primary to
  # anthropic-direct, the fallback attempt gets its own clean
  # injection, and keys never reach the agent. To give the fallback a
  # different account key, add a second CIP whose route targetRef sets
  # `sectionName: anthropic-direct`.
  targetRefs:
    - group: clrk.apoxy.dev
      kind: AIProviderRoute
      name: fallback-router
  # Operator-applied Secret. The README documents the `clrk dev
  # --secret` step — never commit a placeholder value here.
  secretRef:
    name: anthropic-credentials
  secretKey: api-key
  target: Header
  # Anthropic's API uses x-api-key, not Authorization: Bearer.
  headerName: x-api-key
