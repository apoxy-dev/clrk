apiVersion: clrk.apoxy.dev/v1alpha1
kind: DaemonAgent
metadata:
  name: echo-bot
spec:
  workerPoolRef: default
  # Always: even after a successful Anthropic call the daemon supervisor
  # respawns the agent so the demo keeps producing new ext_proc records
  # in the otel-logs / otel-traces panes. RestartPolicy: OnFailure would
  # stop after one clean call (k8s-style semantic).
  restartPolicy: Always
  egressRefs:
    - gatewayRef: echo-bot
  template:
    spec:
      image: docker.io/curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - |
          # The agent loops `call → sleep` so `RestartPolicy: Always`
          # doesn't churn libcontainer + netstack on every iteration.
          # Each call issues ONE Anthropic POST without an `x-api-key`
          # header — the proxy injects it via the attached
          # CredentialInjectionPolicy. The agent never sees the key.
          while :; do
            curl -sS -o /tmp/resp.json -w 'http %{http_code} %{url_effective}\n' \
              -X POST https://api.anthropic.com/v1/messages \
              -H 'content-type: application/json' \
              -H 'anthropic-version: 2023-06-01' \
              -d '{
                "model": "claude-haiku-4-5",
                "max_tokens": 64,
                "messages": [{"role": "user", "content": "Say hi in three words."}]
              }'
            cat /tmp/resp.json
            echo
            sleep 5
          done
