apiVersion: clrk.apoxy.dev/v1alpha1
kind: DaemonAgent
metadata:
  name: echo-bot
spec:
  workerPoolRef: default
  restartPolicy: Always
  egressRefs:
    - gatewayRef: echo-bot
  template:
    spec:
      # Use a public image so dev doesn't need a private pull secret.
      # The worker pulls via ORAS straight to sandbox rootfs.
      image: docker.io/curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            curl -sS -o /dev/null -w 'http %{http_code} %{url_effective}\n' \
              https://httpbin.org/anything
            sleep 5
          done
