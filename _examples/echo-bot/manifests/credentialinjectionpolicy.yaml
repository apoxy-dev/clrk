apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: anthropic
spec:
  # Attach to the Anthropic AIProviderRoute so this credential applies
  # only to api.anthropic.com traffic (not arbitrary outbound).
  parentRefs:
    - group: clrk.apoxy.dev
      kind: AIProviderRoute
      name: anthropic
  # Operator-applied Secret. The README documents the kubectl create
  # secret step — never commit a placeholder value here.
  secretRef:
    name: anthropic-credentials
  secretKey: api-key
  target: Header
  # Anthropic's API uses x-api-key, not Authorization: Bearer.
  headerName: x-api-key
