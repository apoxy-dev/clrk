apiVersion: clrk.apoxy.dev/v1alpha1
kind: CredentialInjectionPolicy
metadata:
  name: google
spec:
  # Attach to the Google AIProviderRoute so this credential applies
  # only to generativelanguage.googleapis.com traffic (not arbitrary
  # outbound).
  parentRefs:
    - group: clrk.apoxy.dev
      kind: AIProviderRoute
      name: google
  # Operator-applied Secret. The README documents the `clrk dev
  # --secret` step — never commit a placeholder value here.
  secretRef:
    name: google-credentials
  secretKey: api-key
  target: Header
  # Gemini API auth is `x-goog-api-key: <key>` (preferred over the
  # `?key=` query param, which would also work but leaks the key into
  # access logs upstream of the MITM).
  headerName: x-goog-api-key
