// WorkerStatus is the per-worker routing state the controller-manager's
// ingress ext_proc consults to pick a per-execution worker. Each worker
// pod publishes its current status as the value of a key in the
// controller-manager's "WORKER_STATUS" NATS JetStream KV bucket, keyed by
// "<podNamespace>.<poolName>.<podName>". The value is last-writer-wins: a
// worker Puts a complete snapshot on every in-flight change and on a 5s
// floor, and Deletes its key on graceful shutdown. The controller-manager
// Watches the bucket and joins each status with the worker's routable pod
// IP + readiness from the WorkerPool Service's EndpointSlices (the IPs
// Envoy Gateway routes to) by pod name.

syntax = "proto3";

package clrk.v1alpha1;

option go_package = "github.com/apoxy-dev/clrk/internal/proto/clrk/v1alpha1;workerstatusv1alpha1";

message WorkerStatus {
  // Warm sandboxes ready to accept a dispatch (Phase=Ready in the
  // worker's SandboxManager). One entry per (ns, agent, revision).
  repeated WarmRevision warm_revisions = 4;

  // In-flight dispatches per (ns, agent). agent identifies the
  // TaskAgent name. These directly drive the cluster-wide
  // MaxConcurrent enforcement in the ingress ext_proc.
  repeated InFlight in_flight = 5;

  // Revisions whose images are pulled into the worker's image
  // store. Routing prefers a worker that already has the image
  // even if no warm sandbox exists.
  repeated CachedImage cached_images = 6;
}

message WarmRevision {
  string namespace = 1;
  string agent = 2;
  string revision = 3;
  // Number of warm sandboxes for this triple. >= 1.
  uint32 count = 4;
}

message InFlight {
  string namespace = 1;
  string agent = 2;
  uint32 count = 3;
}

message CachedImage {
  // Fully qualified image reference (e.g. "registry/foo:abc123").
  string image_ref = 1;
}
